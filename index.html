
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  />

  <title>WebAR GLB Test</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="
      imageTargetSrc: ./target.mind;
      autoStart: true;
      uiScanning: true;
      uiLoading: true;
      uiError: true;
    "
    embedded
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <!-- Assets -->
    <a-assets>

      <!-- Your GLB file -->
      <a-asset-item
        id="myModel"
        src="./model.glb">
      </a-asset-item>

    </a-assets>


    <!-- Camera -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!--
      targetIndex: 0
      This means the first image inside target.mind
    -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- 3D Model -->
      <a-gltf-model
        src="#myModel"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5">
      </a-gltf-model>

    </a-entity>

  </a-scene>

</body>
</html>
